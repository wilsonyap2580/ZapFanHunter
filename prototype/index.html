function $(id){return document.getElementById(id)}
function stars(r){return"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r))}
function chips(){$("chips").innerHTML=[5,10].map(function(k){return'<button class="chip'+(R===k?" on":"")+'" data-r="'+k+'">'+(k===5?"Nearby · 5 km":"10 km area")+"</button>"}).join("")+'<button class="chip loc" id="loc">📍 Use my location</button>';$("areas").innerHTML='<span class="info" style="flex:0 0 auto;margin:auto 0;white-space:nowrap">Pick your area:</span>'+Object.keys(A).map(function(k){return'<button class="chip" data-a="'+k+'">'+k+"</button>"}).join("")}
function card(s){
 var d=dist(center,s.p),f=favs.indexOf(s.id)>-1;
 return'<div class="card'+(status(s).open?"":" cl")+'" data-id="'+s.id+'" style="--c:'+COL[s.id%5]+'"><div class="pic" style="--g:'+GR[s.id%5]+'">'+s.e+'</div><div class="cb"><h3>'+s.n+'</h3><p>'+s.ad+', '+s.a+'</p><div class="meta"><span class="b">★ '+s.r.toFixed(1)+'</span><span class="b d">'+km(d)+'</span><span class="b t">'+s.t[0]+'</span></div><div class="hrs">'+(status(s).open?"🟢 ":"⚫ ")+status(s).txt+'</div></div><div class="heart">'+(f?"❤️":"🤍")+"</div></div>"}
function render(){
 var items,msg;
 if(tab==="f"){
  items=S.filter(function(s){return favs.indexOf(s.id)>-1});
  msg=items.length+" saved place"+(items.length===1?"":"s");
 }else{
  items=S.filter(function(s){
   if(dist(center,s.p)>R)return false;
   if(q&&!areaHit){var h=(s.n+" "+s.ad+" "+s.a+" "+s.t.join(" ")).toLowerCase();return h.indexOf(q)>-1}
   return true});
  msg=items.length+" places within "+R+" km of "+cname;
 }
 items.sort(function(a,b){return dist(center,a.p)-dist(center,b.p)});
 $("info").textContent=msg;
 $("list").innerHTML=items.length?items.map(card).join(""):'<div class="empty"><b>'+(tab==="f"?"💔":"🍽️")+"</b>"+(tab==="f"?"No favourites yet. Tap a shop and hit Save.":emptyMsg())+"</div>";
 $("fc").textContent=favs.length?"("+favs.length+")":"";
 $("t-s").className=tab==="s"?"on":"";$("t-f").className=tab==="f"?"on":"";
 document.querySelector(".srch").style.display=document.querySelector(".chips").style.display=$("areas").style.display=tab==="s"?"":"none";
}
var areaHit=false;
function search(v){
 q=v.trim().toLowerCase();areaHit=false;center=base;cname=base===center&&cname==="Kuala Lumpur city centre"?cname:cname;
 if(q.length>=2){for(var k in A){if(k.toLowerCase().indexOf(q)===0||q.indexOf(k.toLowerCase())===0){center=A[k];cname=k;areaHit=true;break}}}
 if(!areaHit)cname=geo?"you":"Kuala Lumpur city centre";
 render();
}
var geo=false;
function open(id){
 var s=S[id],d=dist(center,s.p),f=favs.indexOf(id)>-1,ll=s.p[0]+","+s.p[1];
 var rv=[0,1,2].map(function(i){var x=RV[(id+i*2)%RV.length];return'<div class="rv"><b>'+x[0]+" · "+stars(Math.max(3,Math.round(s.r)-(i===2?1:0)))+"</b>"+x[1]+"</div>"}).join("");
 $("pn").innerHTML='<button class="x" id="cl">✕</button><div class="pic big'+(status(s).open?"":" cl")+'" style="--g:'+GR[id%5]+'">'+s.e+'</div><div class="det"><h2>'+s.n+'</h2><p style="margin:0;color:var(--mute)">'+s.ad+", "+s.a+'</p><div class="meta" style="margin-top:8px">'+s.t.map(function(t){return'<span class="b p">'+t+"</span>"}).join("")+'</div><div class="stats"><div class="st"><b>'+s.r.toFixed(1)+'</b><small>'+stars(s.r)+'</small></div><div class="st"><b>'+km(d)+'</b><small>distance</small></div><div class="st"><b>'+s.c+'</b><small>reviews</small></div></div><div class="acts"><a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+ll+'&query_place_id='+s.pid+'">🗺️ Google Maps</a><a class="btn w" target="_blank" rel="noopener" href="https://waze.com/ul?ll='+ll+'&navigate=yes">🚗 Waze</a></div><button class="btn s'+(f?" on":"")+'" id="sv" data-id="'+id+'">'+(f?"❤️ Saved":"🤍 Save to Favourite")+'</button>'+hoursHtml(s)+'<h4>Reviews</h4><div class="rv"><b>★ '+s.r.toFixed(1)+' · '+s.c+' Google reviews</b>See what diners say before you go.</div><a class="btn g" style="margin-bottom:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+ll+'&query_place_id='+s.pid+'">⭐ Read reviews on Google Maps</a><p style="color:var(--mute);font-size:.75rem;margin:6px 0 0">Place data from Google Maps, saved 30 Oct 2026. Hours can change, so check before you go.</p></div>';
 $("sh").className="sheet open";
}
document.addEventListener("click",function(e){
 var t=e.target,c=t.closest&&t.closest(".card"),r=t.closest&&t.closest(".chip");
 if(t.id==="cl"||t.id==="sh"){$("sh").className="sheet";return}
 if(t.id==="sv"){var id=+t.getAttribute("data-id"),i=favs.indexOf(id);if(i>-1)favs.splice(i,1);else favs.push(id);persist();open(id);render();return}
 if(r&&r.id==="loc"){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){base=[p.coords.latitude,p.coords.longitude];geo=true;cname="you";search($("q").value);chips()},function(){alert("Location is blocked in this view. Allow location for this page, or tap your area in the Pick your area row.")},{timeout:10000})}else{alert("This browser can't share location. Tap your area in the Pick your area row.")}return}
 if(r&&r.getAttribute("data-a")){$("q").value=r.getAttribute("data-a");search($("q").value);return}if(r&&r.getAttribute("data-r")){R=+r.getAttribute("data-r");chips();render();return}
 if(c){open(+c.getAttribute("data-id"));return}
 if(t.id==="t-s"){tab="s";render()}
 if(t.id==="t-f"||(t.parentNode&&t.parentNode.id==="t-f")){tab="f";render()}
});
$("q").addEventListener("input",function(){search(this.value)});
chips();render();
</script>
</body>
</html>
